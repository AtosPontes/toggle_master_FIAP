apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-init
  namespace: auth-service
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"  
spec:
  backoffLimit: 3 #Exec 3 times before fail
  template:
    spec: #Spec pod
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:15
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for database..."
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                sleep 2
              done

              export PGPASSWORD="$POSTGRES_PASSWORD"

              echo "Running init.sql..."
              PGPASSWORD="$POSTGRES_PASSWORD" psql \
                -h "$POSTGRES_HOST" \
                -p "$POSTGRES_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -v ON_ERROR_STOP=1 \
                -f /sql/init.sql

              SERVICE_API_KEY_HASH="$(printf '%s' "$SERVICE_API_KEY" | sha256sum | awk '{print $1}')"

              echo "Seeding internal service API key..."
              PGPASSWORD="$POSTGRES_PASSWORD" psql \
                -h "$POSTGRES_HOST" \
                -p "$POSTGRES_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -v ON_ERROR_STOP=1 \
                -c "INSERT INTO api_keys (name, key_hash) VALUES ('internal-service', '${SERVICE_API_KEY_HASH}') ON CONFLICT (key_hash) DO NOTHING;"

              echo "Table created successfully"
              echo "--------"
              echo "Checking tables..."
              psql \
                -h "$POSTGRES_HOST" \
                -p "$POSTGRES_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -v ON_ERROR_STOP=1 \
                -c "\dt"

              echo "Job ended"
          volumeMounts:
            - name: sql-volume
              mountPath: /sql
          envFrom:
            - secretRef:
                name: auth-db-secret
            - secretRef:
                name: auth-db-secret-host
      volumes:
        - name: sql-volume
          configMap:
            name: db-auth-service-init-sql
