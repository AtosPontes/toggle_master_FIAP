{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullname }}
spec:
  selector:
    app: {{ .Values.appLabel }}
  ports:
    - name: {{ .Values.fullname }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}
{{- end }}
