apiVersion: v1
kind: ConfigMap
metadata:
  name: db-auth-service-init-sql
  namespace: auth-service
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"  
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        
        -- key_hash armazena o hash SHA-256 da chave, que tem 64 caracteres hexadecimais
        key_hash VARCHAR(64) NOT NULL UNIQUE, 
        
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO api_keys (key_value, is_active)
    VALUES ('tm_key_1462791d24026b89bbc02f2f3072eda9bd7ed4c7e77c398ae9a5300d857f49c2', TRUE)
    ON CONFLICT (key_value) DO NOTHING;