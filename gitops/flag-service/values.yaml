enabled: true

fullname: app-flag-service
appLabel: app-flag-service
replicaCount: 1

strategy:
  maxSurge: 50%
  maxUnavailable: 0

image:
  repository: "903947067217.dkr.ecr.us-east-1.amazonaws.com/togglemaster_flag-service"
  tag: "v1.0.0-6aab2e2"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8002
  targetPort: 8002

ingress:
  enabled: true
  className: nginx
  path: /flag-service(/|$)(.*)
  pathType: ImplementationSpecific
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2

envFromSecrets:
  - flag-db-secret
  - flag-db-secret-host

resources:
  requests:
    cpu: 250m
    memory: 206Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /health
    port: 8002

livenessProbe:
  httpGet:
    path: /health
    port: 8002

autoscaling:
  enabled: false

init:
  configMap:
    enabled: true
    name: db-flag-service-init-sql
    annotations:
      argocd.argoproj.io/hook: PreSync
      argocd.argoproj.io/hook-delete-policy: HookSucceeded
      argocd.argoproj.io/sync-wave: "-2"
    sql: |
      CREATE TABLE IF NOT EXISTS flags (
          id SERIAL PRIMARY KEY,
          name VARCHAR(100) UNIQUE NOT NULL,
          description TEXT,
          is_enabled BOOLEAN NOT NULL DEFAULT false,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
      );

      CREATE OR REPLACE FUNCTION trigger_set_timestamp()
      RETURNS TRIGGER AS $$
      BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
      END;
      $$ LANGUAGE plpgsql;

      DROP TRIGGER IF EXISTS set_timestamp ON flags;

      CREATE TRIGGER set_timestamp
      BEFORE UPDATE ON flags
      FOR EACH ROW
      EXECUTE PROCEDURE trigger_set_timestamp();

      INSERT INTO flags (name, description, is_enabled)
      VALUES ('enable-new-dashboard', 'Ativa o novo dashboard para usuários', true)
      ON CONFLICT (name) DO NOTHING;
  job:
    enabled: true
    name: flag-db-init
    annotations:
      argocd.argoproj.io/hook: PreSync
      argocd.argoproj.io/hook-delete-policy: HookSucceeded
      argocd.argoproj.io/sync-wave: "-1"
    backoffLimit: 3
    containerName: psql
    image: postgres:15
    command:
      - sh
      - -c
    script: |
      set -eu
      echo "Waiting for database..."
      until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
        sleep 2
      done

      export PGPASSWORD="$POSTGRES_PASSWORD"

      echo "Running init.sql..."
      PGPASSWORD="$POSTGRES_PASSWORD" psql \
        -h "$POSTGRES_HOST" \
        -p "$POSTGRES_PORT" \
        -U "$POSTGRES_USER" \
        -d "$POSTGRES_DB" \
        -v ON_ERROR_STOP=1 \
        -f /sql/init.sql
      echo "Table created successfully"
      echo "--------"
      echo "Checking tables..."
      psql \
        -h "$POSTGRES_HOST" \
        -p "$POSTGRES_PORT" \
        -U "$POSTGRES_USER" \
        -d "$POSTGRES_DB" \
        -v ON_ERROR_STOP=1 \
        -c "\dt"

      echo "Job ended"
    volumeMountPath: /sql
    envFromSecrets:
      - flag-db-secret
      - flag-db-secret-host
