name: CI Python Service
description: End-to-end CI/CD pipeline for Python services
inputs:
  service_name:
    description: Service name used in image tagging and GitOps path
    required: true
  service_path:
    description: Relative path to the service root
    required: true
  ecr_repository:
    description: ECR repository name
    required: true
  aws_region:
    description: AWS region
    required: false
    default: us-east-1
  aws_account_id:
    description: AWS account ID used in ECR registry URLs
    required: false
    default: "903947067217"
  aws_access_key_id:
    description: AWS access key ID
    required: false
  aws_secret_access_key:
    description: AWS secret access key
    required: false
  aws_session_token:
    description: AWS session token
    required: false
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build & Unit Test
      uses: ./.github/actions/ci-python-build
      with:
        service_path: ${{ inputs.service_path }}

    - name: Lint / Static Analysis
      uses: ./.github/actions/ci-python-lint
      with:
        service_path: ${{ inputs.service_path }}

    - name: SCA - Trivy filesystem scan (block CRITICAL)
      uses: aquasecurity/trivy-action@0.24.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.service_path }}
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: "1"

    - name: SAST
      uses: ./.github/actions/ci-python-sast
      with:
        service_path: ${{ inputs.service_path }}

    - name: Generate image tag
      id: meta
      shell: bash
      run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Build docker image
      shell: bash
      run: |
        docker build \
          --pull \
          -t ${{ inputs.service_name }}:${{ steps.meta.outputs.tag }} \
          -f ${{ inputs.service_path }}/Dockerfile \
          ${{ inputs.service_path }}

    - name: Container scan with Trivy (block CRITICAL)
      uses: aquasecurity/trivy-action@0.24.0
      with:
        image-ref: ${{ inputs.service_name }}:${{ steps.meta.outputs.tag }}
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: "1"

    - name: Validate AWS credentials settings
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
      run: |
        if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
          echo "Missing AWS credentials in GitHub Secrets."
          echo "Set AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY."
          exit 1
        fi

    - name: Configure AWS credentials (Access Key)
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ inputs.aws_region }}
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-session-token: ${{ inputs.aws_session_token }}

    - name: Login to Amazon ECR
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Validate ECR account
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      shell: bash
      env:
        LOGGED_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        set -euo pipefail
        EXPECTED_REGISTRY="${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com"
        if [ "${LOGGED_REGISTRY}" != "${EXPECTED_REGISTRY}" ]; then
          echo "Wrong AWS account for ECR login."
          echo "Expected: ${EXPECTED_REGISTRY}"
          echo "Received: ${LOGGED_REGISTRY}"
          exit 1
        fi

    - name: Push docker image to ECR
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      shell: bash
      env:
        REPOSITORY: ${{ inputs.ecr_repository }}
        IMAGE_TAG: ${{ steps.meta.outputs.tag }}
      run: |
        REGISTRY="${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com"
        docker tag ${{ inputs.service_name }}:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
        docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

    - name: Update GitOps deployment image tag
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      shell: bash
      env:
        REPOSITORY: ${{ inputs.ecr_repository }}
        IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        DEPLOYMENT_FILE: gitops/${{ inputs.service_name }}/deployment.yaml
      run: |
        set -euo pipefail
        REGISTRY="${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com"
        NEW_IMAGE="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
        if [ ! -f "${DEPLOYMENT_FILE}" ]; then
          echo "GitOps file not found: ${DEPLOYMENT_FILE}"
          exit 1
        fi
        sed -i -E "s|(^[[:space:]]*image:[[:space:]]*).*$|\\1${NEW_IMAGE}|" "${DEPLOYMENT_FILE}"
        echo "Updated ${DEPLOYMENT_FILE} -> ${NEW_IMAGE}"

    - name: Commit GitOps image update
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      shell: bash
      env:
        DEPLOYMENT_FILE: gitops/${{ inputs.service_name }}/deployment.yaml
        IMAGE_TAG: ${{ steps.meta.outputs.tag }}
      run: |
        set -euo pipefail
        if git diff --quiet -- "${DEPLOYMENT_FILE}"; then
          echo "No GitOps changes to commit."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${DEPLOYMENT_FILE}"
        git commit -m "chore(gitops): update ${{ inputs.service_name }} image to ${IMAGE_TAG}"
        for attempt in 1 2 3; do
          if git push origin HEAD:main; then
            exit 0
          fi

          echo "Push rejected (attempt ${attempt}/3). Rebasing on origin/main and retrying..."
          git fetch origin main
          git rebase origin/main
        done

        echo "Failed to push GitOps commit after 3 attempts."
        exit 1
