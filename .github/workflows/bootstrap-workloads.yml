name: Bootstrap Workloads

on:
  workflow_dispatch:

jobs:
  auth:
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/template-ci-go.yml
    with:
      service_name: auth-service
      service_path: apps/local/1-auth-service
      ecr_repository: togglemaster_auth-service

  flag:
    needs: auth
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/template-ci-python.yml
    with:
      service_name: flag-service
      service_path: apps/local/2-flag-service
      ecr_repository: togglemaster_flag-service

  targeting:
    needs: flag
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/template-ci-python.yml
    with:
      service_name: targeting-service
      service_path: apps/local/3-targeting-service
      ecr_repository: togglemaster_targeting-service

  evaluation:
    needs: targeting
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/template-ci-go.yml
    with:
      service_name: evaluation-service
      service_path: apps/local/4-evaluation-service
      ecr_repository: togglemaster_evaluation-service

  analytics:
    needs: evaluation
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/template-ci-python.yml
    with:
      service_name: analytics-service
      service_path: apps/local/5-analytics-service
      ecr_repository: togglemaster_analytics-service
