name: Terraform CI

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/ci-terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '.github/workflows/ci-terraform.yml'

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.0"

jobs:
  # ── Job 1: IaC Security Scan ──────────────────────────────────────────────
  security-scan:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov - Terraform IaC Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: cli

  # ── Job 2: Terraform Validate & Plan ─────────────────────────────────────
  terraform-validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_cidr_block: ${{ secrets.TF_VAR_CIDR_BLOCK }}
          TF_VAR_project_name: ${{ secrets.TF_VAR_PROJECT_NAME }}
          TF_VAR_db_user: ${{ secrets.TF_VAR_DB_USER }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_master_key: ${{ secrets.TF_VAR_MASTER_KEY }}
          TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
          TF_VAR_service_api_key: ${{ secrets.TF_VAR_SERVICE_API_KEY }}
        run: terraform plan -no-color -input=false
        continue-on-error: false

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.stdout }}`;
            const body = `## Terraform Plan\n\`\`\`\n${plan}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.slice(0, 65536)
            });
