name: CI Analytics Service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/local/5-analytics-service/**'
      - 'gitops/analytics-service/**'
      - '.github/workflows/analytics-service.yml'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - 'apps/local/5-analytics-service/**'
      - 'gitops/analytics-service/**'
      - '.github/workflows/analytics-service.yml'
      - '.github/actions/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Run analytics-service pipeline
        uses: ./.github/actions/ci-python-service
        with:
          service_name: analytics-service
          service_path: apps/local/5-analytics-service
          ecr_repository: togglemaster_analytics-service
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
      
